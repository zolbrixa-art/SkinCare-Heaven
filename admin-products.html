<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Add Items - Admin</title><link rel="stylesheet" href="styles.css"></head><body class="admin-body"><main class="admin-shell"><section id="admin-dashboard" data-admin-view="products" class="is-hidden"><header class="admin-header"><a class="admin-brand" href="admin.html">SH <span>SKINCARE HEAVEN</span></a><nav class="admin-nav"><a href="admin.html">Manage Store</a><a class="active" href="admin-products.html">Manage Products</a><a href="admin-orders.html">Recent Orders</a><a href="admin-feedback.html">Community Feedback</a><a href="admin-users.html">Users</a></nav><button id="admin-logout" class="outline-button">Logout</button></header><section class="admin-page-heading"><p class="eyebrow">CATALOGUE</p><h1>Add items</h1><p>Create and remove products shown in the customer store.</p></section><div class="admin-card admin-products-card"><div class="admin-card-heading"><h2>Products</h2><span id="product-count"></span></div><form id="add-product-form" class="admin-product-form"><input id="product-name" required placeholder="Product name"><input id="product-price" required type="number" min="0" step="1" placeholder="Price in PKR"><select id="product-category" required><option value="">Category</option><option>Cleansers</option><option>Moisturizers</option><option>Serums</option><option>Sunscreens</option></select><input id="product-image" required placeholder="Image path e.g. images/toner.jpg"><button type="submit">Add product</button></form><div id="admin-products-list" class="admin-list"></div></div></section></main><script src="scripts.js"></script></body></html>
