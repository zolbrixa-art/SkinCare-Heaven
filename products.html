<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Products - Skincare Heaven</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="inner-header">
        <a class="site-logo" href="index.html"><span>SH</span> SKINCARE HEAVEN</a>
        <nav class="main-nav">
            <a href="index.html">Home</a>
            <a class="active" href="products.html">Products</a>
            <a href="categories.html">Categories</a>
            <a href="contact.html">Contact</a>
            <a class="nav-cart" href="cart.html">Cart <span>→</span></a>
            <button class="logout-button" type="button">Logout</button>
        </nav>
    </header>
    <h1 class="page-title">Our Products</h1>

    <main>
        <div class="products-container">
            <h2>Explore Our Skincare Products</h2>
            
            <div class="catalog-toolbar">
                <div class="category-filters">
                    <button class="category-filter active" data-category="">All products</button>
                    <button class="category-filter" data-category="Cleansers">Cleansers</button>
                    <button class="category-filter" data-category="Moisturizers">Moisturizers</button>
                    <button class="category-filter" data-category="Serums">Serums</button>
                    <button class="category-filter" data-category="Sunscreens">Sunscreens</button>
                </div>
                <select id="product-category-select" aria-label="Filter products by category">
                    <option value="">Filter by category</option><option value="Cleansers">Cleansers</option><option value="Moisturizers">Moisturizers</option><option value="Serums">Serums</option><option value="Sunscreens">Sunscreens</option>
                </select>
            </div>
            <div class="product-grid" id="product-grid"></div>
        </div>
    </main>

    <footer>
        <p>&copy; 2024 Skincare Website | All Rights Reserved</p>
    </footer>
    <script src="scripts.js"></script>
